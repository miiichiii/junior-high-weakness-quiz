<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fbfd" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23286a88'/%3E%3Cpath d='M19 34.5 28 43l17-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Motion Quiz Demo</title>
    <style>
      :root {
        color: #17202a;
        background: #f5f8fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-snap: cubic-bezier(0.2, 0.9, 0.2, 1.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .quiz-shell {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: clamp(0.85rem, 3vw, 2rem);
        color: #17202a;
        background:
          linear-gradient(115deg, rgba(40, 106, 136, 0.16), transparent 34%),
          linear-gradient(245deg, rgba(221, 92, 77, 0.14), transparent 36%),
          linear-gradient(180deg, #f8fbfd, #eaf2f4 58%, #f7f9fb);
      }

      .quiz-frame {
        width: min(100%, 46rem);
        overflow: hidden;
        border: 1px solid rgba(23, 32, 42, 0.1);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.62)),
          #ffffff;
        box-shadow:
          0 1.3rem 3.5rem rgba(42, 52, 60, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }

      .quiz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: clamp(1rem, 3vw, 1.35rem);
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 0.75rem;
      }

      .brand-icon {
        display: grid;
        width: 2.35rem;
        height: 2.35rem;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        color: #ffffff;
        background: linear-gradient(135deg, #286a88, #dd5c4d);
        box-shadow: 0 0.55rem 1.4rem rgba(40, 106, 136, 0.22);
      }

      .brand-lockup p,
      .eyebrow {
        margin: 0;
        color: #6a747c;
        font-size: 0.73rem;
        font-weight: 780;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .brand-lockup h1 {
        margin: 0.1rem 0 0;
        overflow-wrap: anywhere;
        font-size: clamp(1.1rem, 4vw, 1.55rem);
        line-height: 1.12;
        letter-spacing: 0;
      }

      .score-pill {
        display: inline-grid;
        min-width: 5.4rem;
        min-height: 2.25rem;
        flex: 0 0 auto;
        place-items: center;
        padding: 0.42rem 0.7rem;
        border: 1px solid rgba(40, 106, 136, 0.16);
        border-radius: 8px;
        color: #18495e;
        background: rgba(40, 106, 136, 0.08);
        font-size: 0.88rem;
        font-weight: 820;
      }

      .progress-track {
        height: 0.36rem;
        margin: 0 clamp(1rem, 3vw, 1.35rem);
        overflow: hidden;
        border-radius: 999px;
        background: rgba(23, 32, 42, 0.08);
      }

      .progress-track span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #286a88, #7a9551, #dd5c4d);
        transition: width 420ms var(--ease-out);
      }

      .question-card,
      .result-panel {
        padding: clamp(1rem, 3vw, 1.35rem);
      }

      .question-card {
        animation: card-in 360ms var(--ease-out) both;
      }

      .question-meta {
        display: flex;
        justify-content: space-between;
        min-height: 1.5rem;
      }

      .question-meta span {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        color: #667179;
        font-size: 0.78rem;
        font-weight: 760;
      }

      .question-card h2,
      .result-panel h2 {
        margin: 0.8rem 0 1rem;
        color: #16212a;
        font-size: clamp(1.35rem, 5.2vw, 2.3rem);
        line-height: 1.18;
        letter-spacing: 0;
      }

      .choice-grid {
        display: grid;
        gap: 0.72rem;
      }

      .choice-button {
        position: relative;
        display: grid;
        grid-template-columns: 2.15rem minmax(0, 1fr) 1.7rem;
        align-items: center;
        min-height: 4.05rem;
        width: 100%;
        gap: 0.7rem;
        padding: 0.72rem 0.8rem;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 42, 0.11);
        border-radius: 8px;
        color: #1d2832;
        cursor: pointer;
        text-align: left;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 0.45rem 1.2rem rgba(42, 52, 60, 0.07);
        opacity: 0;
        transform: translate3d(0, 12px, 0);
        animation: option-in 420ms var(--ease-out) forwards;
        animation-delay: var(--stagger);
        transition:
          border-color 190ms ease,
          background 190ms ease,
          box-shadow 190ms ease,
          color 190ms ease,
          transform 190ms var(--ease-snap);
      }

      .choice-button::before {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.56), transparent);
        opacity: 0;
        transform: translate3d(-62%, 0, 0);
        transition:
          opacity 190ms ease,
          transform 360ms var(--ease-out);
      }

      @media (hover: hover) and (pointer: fine) {
        .choice-button:not(:disabled):hover {
          border-color: rgba(40, 106, 136, 0.34);
          box-shadow: 0 0.65rem 1.6rem rgba(42, 52, 60, 0.1);
          transform: translate3d(0, -1px, 0);
        }

        .choice-button:not(:disabled):hover::before {
          opacity: 1;
          transform: translate3d(62%, 0, 0);
        }
      }

      .choice-button:active {
        transform: translate3d(0, 1px, 0) scale(0.992);
      }

      .choice-button:disabled {
        cursor: default;
      }

      .choice-letter {
        display: grid;
        width: 2.15rem;
        height: 2.15rem;
        place-items: center;
        border-radius: 8px;
        color: #286a88;
        background: rgba(40, 106, 136, 0.1);
        font-size: 0.85rem;
        font-weight: 840;
      }

      .choice-text {
        position: relative;
        z-index: 1;
        min-width: 0;
        font-size: clamp(0.95rem, 3.7vw, 1.04rem);
        font-weight: 720;
        line-height: 1.35;
      }

      .choice-state {
        display: grid;
        width: 1.7rem;
        height: 1.7rem;
        place-items: center;
        border-radius: 999px;
      }

      .choice-button.is-selected {
        transform: translate3d(0, -1px, 0) scale(1.006);
      }

      .choice-button.is-correct {
        border-color: rgba(71, 124, 74, 0.48);
        color: #183f20;
        background: linear-gradient(180deg, rgba(232, 246, 221, 0.95), rgba(246, 255, 241, 0.82));
        box-shadow: 0 0.7rem 1.7rem rgba(71, 124, 74, 0.16);
      }

      .choice-button.is-correct .choice-letter,
      .choice-button.is-correct .choice-state {
        color: #ffffff;
        background: #477c4a;
      }

      .choice-button.is-wrong {
        border-color: rgba(183, 74, 60, 0.45);
        color: #6d2a24;
        background: linear-gradient(180deg, rgba(255, 235, 231, 0.98), rgba(255, 248, 244, 0.82));
        animation: wrong-nudge 260ms ease both;
      }

      .choice-button.is-wrong .choice-letter,
      .choice-button.is-wrong .choice-state {
        color: #ffffff;
        background: #b74a3c;
      }

      .feedback-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.9rem;
        min-height: 4.6rem;
        margin-top: 0.9rem;
        padding-top: 0.9rem;
        border-top: 1px solid rgba(23, 32, 42, 0.09);
        opacity: 0;
        transform: translate3d(0, 8px, 0);
        transition:
          opacity 260ms var(--ease-out),
          transform 260ms var(--ease-out);
      }

      .feedback-panel.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .feedback-panel p,
      .result-copy {
        margin: 0;
        color: #52606a;
        font-size: clamp(0.9rem, 3.4vw, 1rem);
        font-weight: 570;
        line-height: 1.58;
      }

      .primary-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        min-height: 2.7rem;
        padding: 0.64rem 0.85rem;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        cursor: pointer;
        background: linear-gradient(135deg, #18495e, #dd5c4d);
        box-shadow: 0 0.7rem 1.5rem rgba(40, 106, 136, 0.2);
        font-weight: 820;
        transition:
          box-shadow 180ms ease,
          transform 180ms var(--ease-snap);
      }

      @media (hover: hover) and (pointer: fine) {
        .primary-action:hover {
          box-shadow: 0 0.9rem 1.8rem rgba(40, 106, 136, 0.25);
          transform: translate3d(0, -1px, 0);
        }
      }

      .primary-action:active {
        transform: translate3d(0, 1px, 0) scale(0.99);
      }

      .result-panel {
        display: grid;
        min-height: 28rem;
        align-content: center;
        justify-items: start;
        animation: result-in 420ms var(--ease-out) both;
      }

      .result-mark {
        display: grid;
        width: 4rem;
        height: 4rem;
        place-items: center;
        border-radius: 8px;
        color: #ffffff;
        background: linear-gradient(135deg, #477c4a, #286a88);
        box-shadow: 0 0.75rem 1.8rem rgba(71, 124, 74, 0.2);
      }

      .result-copy {
        max-width: 34rem;
        margin-bottom: 1.15rem;
      }

      svg {
        display: block;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translate3d(16px, 0, 0) scale(0.988);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes option-in {
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes wrong-nudge {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        35% {
          transform: translate3d(-5px, 0, 0);
        }
        70% {
          transform: translate3d(4px, 0, 0);
        }
      }

      @keyframes result-in {
        from {
          opacity: 0;
          transform: translate3d(0, 14px, 0) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @media (max-width: 560px) {
        .quiz-shell {
          align-items: stretch;
          padding: 0;
        }

        .quiz-frame {
          min-height: 100svh;
          border: 0;
          border-radius: 0;
        }

        .quiz-header {
          align-items: flex-start;
        }

        .score-pill {
          min-width: 4.7rem;
        }

        .choice-button {
          grid-template-columns: 2rem minmax(0, 1fr) 1.5rem;
          min-height: 3.9rem;
          padding: 0.68rem;
        }

        .choice-letter {
          width: 2rem;
          height: 2rem;
        }

        .feedback-panel {
          grid-template-columns: 1fr;
        }

        .primary-action {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="quiz-shell">
      <section class="quiz-frame" aria-label="4択クイズデモ">
        <header class="quiz-header">
          <div class="brand-lockup">
            <span class="brand-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
                <path d="M20 2v4" />
                <path d="M22 4h-4" />
                <circle cx="4" cy="20" r="2" />
              </svg>
            </span>
            <div>
              <p>Motion Quiz</p>
              <h1>アニメーション基礎</h1>
            </div>
          </div>
          <div class="score-pill" id="score-pill" aria-label="現在のスコア">1 / 3</div>
        </header>

        <div class="progress-track" aria-hidden="true">
          <span id="progress-bar"></span>
        </div>

        <div id="quiz-body"></div>
      </section>
    </main>

    <script>
      const questions = [
        {
          prompt: "古いスマホでも軽く動きやすいアニメーションはどれ？",
          choices: [
            "top と left を毎フレーム変える",
            "transform と opacity を使う",
            "大きな blur を常に動かす",
            "全カードに無限バウンスを付ける",
          ],
          correctIndex: 1,
          note: "transform と opacity はレイアウト計算を増やしにくく、4択クイズの画面遷移に向いています。",
        },
        {
          prompt: "スクロール表示のフェードアップで使いやすい仕組みは？",
          choices: [
            "IntersectionObserver",
            "1msごとの setInterval",
            "巨大なGIF背景",
            "全要素の box-shadow アニメーション",
          ],
          correctIndex: 0,
          note: "IntersectionObserver は見えたタイミングだけ反応できるので、スマホでも扱いやすいです。",
        },
        {
          prompt: "タップできる選択肢のトランシジョンで大切なことは？",
          choices: [
            "押すたびに周囲のレイアウトを動かす",
            "文字が読めないほど回転させる",
            "位置とサイズを安定させる",
            "正解だけ画像を大量に読み込む",
          ],
          correctIndex: 2,
          note: "タップ対象は安定しているほど使いやすく、短いスケール変化や色変化が効果的です。",
        },
      ];

      const body = document.getElementById("quiz-body");
      const progressBar = document.getElementById("progress-bar");
      const scorePill = document.getElementById("score-pill");
      const letters = ["A", "B", "C", "D"];
      let questionIndex = 0;
      let score = 0;
      let selectedIndex = null;

      const icon = {
        help: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
        check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
        next: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
        retry: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>',
      };

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function updateHeader(isFinished = false) {
        const progress = isFinished
          ? 100
          : ((questionIndex + (selectedIndex !== null ? 1 : 0)) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
        scorePill.textContent = isFinished ? `${score} / ${questions.length}` : `${questionIndex + 1} / ${questions.length}`;
      }

      function renderQuestion() {
        selectedIndex = null;
        updateHeader(false);
        const current = questions[questionIndex];
        body.innerHTML = `
          <section class="question-card">
            <div class="question-meta">
              <span>${icon.help} Question ${questionIndex + 1}</span>
            </div>
            <h2>${escapeHtml(current.prompt)}</h2>
            <div class="choice-grid">
              ${current.choices.map((choice, index) => `
                <button class="choice-button" style="--stagger: ${index * 58}ms" type="button" data-choice="${index}">
                  <span class="choice-letter">${letters[index]}</span>
                  <span class="choice-text">${escapeHtml(choice)}</span>
                  <span class="choice-state" aria-hidden="true"></span>
                </button>
              `).join("")}
            </div>
            <div class="feedback-panel" id="feedback-panel">
              <p>&nbsp;</p>
            </div>
          </section>
        `;

        body.querySelectorAll("[data-choice]").forEach((button) => {
          button.addEventListener("click", () => chooseOption(Number(button.dataset.choice)));
        });
      }

      function chooseOption(index) {
        if (selectedIndex !== null) return;

        selectedIndex = index;
        const current = questions[questionIndex];
        const isCorrect = index === current.correctIndex;
        if (isCorrect) score += 1;
        scorePill.textContent = isCorrect ? "正解" : "もう少し";
        updateHeader(false);

        body.querySelectorAll("[data-choice]").forEach((button) => {
          const choiceIndex = Number(button.dataset.choice);
          button.disabled = true;
          button.classList.toggle("is-selected", choiceIndex === index);
          button.classList.toggle("is-correct", choiceIndex === current.correctIndex);
          button.classList.toggle("is-wrong", choiceIndex === index && !isCorrect);
          const state = button.querySelector(".choice-state");
          state.innerHTML = choiceIndex === current.correctIndex
            ? icon.check
            : choiceIndex === index && !isCorrect
              ? icon.x
              : "";
        });

        const feedback = document.getElementById("feedback-panel");
        const isLast = questionIndex === questions.length - 1;
        feedback.innerHTML = `
          <p>${escapeHtml(current.note)}</p>
          <button class="primary-action" type="button" id="next-button">
            ${isLast ? "結果を見る" : "次の問題"}
            ${icon.next}
          </button>
        `;
        requestAnimationFrame(() => feedback.classList.add("is-visible"));
        document.getElementById("next-button").addEventListener("click", () => {
          if (isLast) {
            renderResult();
            return;
          }
          questionIndex += 1;
          renderQuestion();
        });
      }

      function renderResult() {
        selectedIndex = null;
        updateHeader(true);
        body.innerHTML = `
          <section class="result-panel">
            <span class="result-mark" aria-hidden="true">${icon.check}</span>
            <p class="eyebrow">Result</p>
            <h2>${score === questions.length ? "満点です" : "ここまで完了"}</h2>
            <p class="result-copy">
              ${score}問正解。画面はカードの入れ替え、選択肢のスタガー、正誤フィードバックだけで構成しています。
            </p>
            <button class="primary-action" type="button" id="restart-button">
              ${icon.retry}
              もう一度
            </button>
          </section>
        `;
        document.getElementById("restart-button").addEventListener("click", () => {
          questionIndex = 0;
          score = 0;
          renderQuestion();
        });
      }

      renderQuestion();
    </script>
  </body>
</html>
