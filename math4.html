<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>夏休み 算数マスター（4年生）</title>
<style>
:root{
  --ink:#1b2a4a;
  --muted:#7a8698;
  --paper:#ffffff;
  --bg:#fdf6ec;
  --accent:#3aa8ff;
  --accent-deep:#1f7fd1;
  --good:#2eb872;
  --bad:#e8505b;
  --carry:#ff9f43;
  --guide:#dfe6ee;
  --gold:#ffc94d;
  --radius:18px;
  /* モードごとの色（ひきざん・九九・かけ算・わり算） */
  --sub:#ff7a6b;--sub-soft:#fff0ee;
  --kuku:#3aa8ff;--kuku-soft:#eaf5ff;
  --mult:#2eb872;--mult-soft:#e9fbf1;
  --div:#8a6cff;--div-soft:#f1edff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic",system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%,#fff3d6 0,transparent 32%),radial-gradient(circle at 92% 30%,#e7f4ff 0,transparent 30%);
  color:var(--ink);
  overscroll-behavior:none;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 16px 28px;
}
.hidden{display:none !important}
button{font-family:inherit}

/* ---- ヘッダー: 戻るは左上の1つだけ。行き先の名前を書く ---- */
header.topbar{
  width:100%;max-width:480px;
  display:flex;align-items:center;gap:8px;
  padding:2px 0 12px;
}
#back-link{
  font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;
  background:#fff;border-radius:999px;padding:9px 14px;
  box-shadow:0 2px 6px rgba(27,42,74,.12);white-space:nowrap;
  max-width:44%;overflow:hidden;text-overflow:ellipsis;
}
#back-link:active{transform:translateY(1px)}
.topbar-title{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#star-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:#fff;border-radius:999px;padding:7px 11px;
  font-size:14px;font-weight:700;color:#b07a00;
  box-shadow:0 2px 6px rgba(27,42,74,.12);white-space:nowrap;
}
#star-chip.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
#sound-btn{
  border:none;background:#fff;border-radius:50%;
  width:38px;height:38px;font-size:17px;
  box-shadow:0 2px 6px rgba(27,42,74,.12);cursor:pointer;flex-shrink:0;
}
main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}

/* ---- ねこ先生（ふきだし） ---- */
.buddy{display:flex;align-items:flex-end;gap:8px}
.buddy-face{font-size:40px;line-height:1;flex-shrink:0;transition:transform .2s}
.buddy-face.hop{animation:hop .5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-6deg)}}
.buddy-say{
  position:relative;flex:1;min-height:44px;
  background:#fff;border-radius:16px;padding:10px 14px;
  font-size:15px;font-weight:700;line-height:1.5;
  box-shadow:0 2px 8px rgba(27,42,74,.08);
}
.buddy-say::before{
  content:'';position:absolute;left:-7px;bottom:12px;
  border:7px solid transparent;border-right-color:#fff;border-left:0;
}
.buddy-say.good{color:#1f8a55}
.buddy-say.bad{color:#c2410c}
.buddy-say.wow{color:#b07a00}
.buddy-say small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}

/* ---- メニュー ---- */
#menu-screen{display:flex;flex-direction:column;gap:14px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-section-title{font-size:13px;font-weight:700;color:var(--muted);padding:4px 2px 0}
.mode-tile{
  --c:var(--accent);--soft:var(--kuku-soft);
  position:relative;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  background:var(--paper);border:none;border-radius:var(--radius);
  box-shadow:0 4px 0 var(--soft),0 6px 16px rgba(27,42,74,.08);
  padding:14px 14px 12px;text-align:left;cursor:pointer;min-width:0;
}
.mode-tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--soft),0 3px 8px rgba(27,42,74,.08)}
.mode-tile[data-color="sub"]{--c:var(--sub);--soft:var(--sub-soft)}
.mode-tile[data-color="kuku"]{--c:var(--kuku);--soft:var(--kuku-soft)}
.mode-tile[data-color="mult"]{--c:var(--mult);--soft:var(--mult-soft)}
.mode-tile[data-color="div"]{--c:var(--div);--soft:var(--div-soft)}
.mode-glyph{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--c);color:#fff;font-size:30px;font-weight:700;line-height:1;
}
.mode-tile h3{font-size:17px;line-height:1.25}
.mode-tile .mode-sub{font-size:12px;font-weight:700;color:var(--muted);line-height:1.35}
.mode-bar{width:100%;height:9px;border-radius:999px;background:#eef2f6;overflow:hidden;display:flex}
.mode-bar i{display:block;height:100%}
.mode-bar .bar-master{background:var(--gold)}
.mode-bar .bar-clear{background:var(--c);opacity:.75}
.mode-badge{
  position:absolute;top:-8px;right:10px;
  font-size:11.5px;font-weight:700;color:#fff;background:var(--bad);
  border-radius:999px;padding:3px 9px;box-shadow:0 2px 6px rgba(232,80,91,.35);
}
.mode-badge.next{background:var(--c);box-shadow:none}
.menu-grid.small .mode-tile{padding:12px 10px 10px;gap:5px}
.menu-grid.small{grid-template-columns:repeat(3,1fr);gap:10px}
.menu-grid.small .mode-glyph{width:40px;height:40px;font-size:24px;border-radius:12px}
.menu-grid.small h3{font-size:14px}
.mode-tile.locked{opacity:.6}
.mode-tile.locked .mode-glyph{background:#c7cfda}

/* ---- ひきざん・九九の一覧 ---- */
#drill-screen{display:flex;flex-direction:column;gap:10px}
#drill-screen[data-drill="sub"]{--c:var(--sub);--soft:var(--sub-soft)}
#drill-screen[data-drill="kuku"]{--c:var(--kuku);--soft:var(--kuku-soft)}
.drill-hero{
  display:flex;align-items:center;gap:12px;
  background:var(--paper);border-radius:var(--radius);padding:14px;
  box-shadow:0 3px 10px rgba(27,42,74,.08);
}
.drill-hero .mode-glyph{background:var(--c);flex-shrink:0}
.drill-hero-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.drill-hero h2{font-size:19px}
.drill-hero .mode-bar .bar-clear{background:var(--c)}
.drill-hero p{font-size:12.5px;font-weight:700;color:var(--muted)}
.big-btn{
  width:100%;border:none;border-radius:var(--radius);cursor:pointer;
  background:var(--c,var(--accent));color:#fff;
  padding:15px 16px;font-size:18px;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.14);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.big-btn small{font-size:12.5px;font-weight:700;opacity:.92}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.order-note{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.dan-row{
  position:relative;
  display:flex;align-items:center;gap:10px;
  background:var(--paper);border:none;border-radius:14px;
  padding:12px 14px;cursor:pointer;
  box-shadow:0 2px 8px rgba(27,42,74,.08);
}
.dan-row:active{transform:translateY(1px)}
.dan-row.recommended{outline:3px solid var(--c);background:var(--soft)}
.dan-row.done .dan-name::after{content:' 🏅'}
.dan-reco{
  position:absolute;top:-9px;right:12px;
  font-size:11px;font-weight:700;color:#fff;
  background:var(--c);border-radius:999px;padding:2px 10px;
}
.dan-name{font-size:15px;font-weight:700;color:var(--ink);width:96px;text-align:left;flex-shrink:0;white-space:nowrap}
.dan-cells{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-width:190px}
.dan-cell{width:13px;height:13px;border-radius:4px;background:#e8edf3;display:inline-block}
.dan-cell.learn{background:#bcd5ff}
.dan-cell.clear{background:#8fd6ae}
.dan-cell.master{background:var(--gold)}
.dan-count{font-size:12.5px;font-weight:700;color:var(--muted);min-width:36px;text-align:right;margin-left:auto}
.stage-head{display:flex;flex-direction:column;gap:1px;padding:10px 4px 0}
.stage-head strong{font-size:14.5px;color:var(--ink)}
.stage-head small{font-size:11.5px;color:#8a95a5;font-weight:700}
.dan-legend{
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-size:11.5px;font-weight:700;color:var(--muted);padding-top:4px;
}

/* ---- もんだい画面 ---- */
#session-head{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.sess-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
#session-title{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#session-progress{font-size:13px;font-weight:700;color:var(--muted)}
#combo{
  font-size:12.5px;font-weight:700;color:#fff;background:#ff8a3d;
  border-radius:999px;padding:3px 9px;
}
#combo.pop{animation:bump .45s}
.sess-bar{height:12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px #eef2f6;overflow:hidden}
#sess-fill{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--c,var(--accent)),#ffd166);
  transition:width .45s ease;
}
#session-screen[data-color="sub"]{--c:var(--sub)}
#session-screen[data-color="kuku"]{--c:var(--kuku)}
#session-screen[data-color="mult"]{--c:var(--mult)}
#session-screen[data-color="div"]{--c:var(--div)}
.card{
  background:var(--paper);border-radius:var(--radius);
  box-shadow:0 3px 10px rgba(27,42,74,.08);
  padding:14px;position:relative;
}
#controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button.act{
  font-size:15px;font-weight:700;
  padding:11px 18px;border-radius:999px;border:none;cursor:pointer;
  box-shadow:0 3px 0 rgba(27,42,74,.15);
}
button.act:active{transform:translateY(2px);box-shadow:none}
button.primary{background:var(--accent);color:#fff}
button.success{background:var(--good);color:#fff}
button.ghost{background:#fff;color:#5a6678;border:2px solid var(--guide)}
#btn-next{font-size:18px;padding:13px 30px}
.ghost-btn{
  font-size:13px;font-weight:700;color:var(--accent-deep);
  background:#eaf5ff;border:none;border-radius:999px;padding:7px 14px;cursor:pointer;
}

/* ---- 九九カード ---- */
.kuku-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.kuku-kind{font-size:12px;font-weight:700;color:#7a8698}
.kuku-equation{display:flex;align-items:center;gap:10px;font-size:38px;font-weight:700}
.kuku-op{color:#9aa5b5;font-size:26px}
.kuku-slot{
  width:1.6em;height:1.15em;display:inline-flex;align-items:center;justify-content:center;
  border:3px dashed var(--accent);border-radius:12px;color:var(--accent-deep);
  background:#eaf5ff;font-size:.85em;
}
.kuku-slot.correct{border-style:solid;border-color:var(--good);background:#e9fbf1;color:var(--good);animation:pop-flash .32s}
.kuku-slot.drop-hover{background:#d8ecff}
.kuku-array{display:flex;flex-direction:column;gap:4px;padding:8px;background:#f7f9fc;border-radius:12px}
.kuku-array.hidden{display:none}
.kuku-array-row{display:flex;gap:4px}
.kuku-dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.kuku-choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---- くり下がりのひきざん（さくらんぼ＋テンフレーム） ---- */
.kuku-slot.active{border-color:var(--carry);background:#fff3e0;color:var(--carry)}
.kuku-slot.sub-slot{font-size:24px;width:1.5em;height:1.2em;border-width:2.5px}
.sub-visual{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:#f7f9fc;border-radius:14px;padding:12px;width:100%;
}
.sub-visual.hidden{display:none}
.sub-say{
  font-size:14px;font-weight:700;color:#5a6678;text-align:center;line-height:1.6;
}
.sub-say b{color:var(--accent-deep);font-size:17px}
/* さくらんぼ: 13 の下に枝を伸ばし、10はテンフレームの真上・ばらは●の真上に置く */
.sub-stage{
  display:grid;grid-template-columns:118px 118px;gap:2px 10px;
  justify-content:center;align-items:center;
}
.cherry-top{
  grid-column:1/3;justify-self:center;
  font-size:26px;font-weight:700;color:var(--ink);
}
.cherry-branch{grid-column:1/3;justify-self:center;width:246px;height:24px}
.cherry-branch path{stroke:var(--carry);stroke-width:2.5;fill:none;stroke-linecap:round}
.cherry-num{
  justify-self:center;font-size:19px;font-weight:700;color:var(--carry);
}
#cherry-ten{grid-column:1}
#cherry-loose{grid-column:2}
#tf-ten{grid-column:1}
#tf-loose{grid-column:2}
.tf-group{justify-self:center;border-radius:10px;padding:2px;transition:background .25s}
.ten-frame{
  display:grid;grid-template-columns:repeat(5,18px);gap:3px;
  padding:5px;background:#fff;border:2px solid var(--guide);border-radius:8px;
}
.loose-dots{
  display:grid;grid-template-columns:repeat(4,18px);gap:3px;
  padding:5px;justify-content:center;
}
.tf-dot{
  width:18px;height:18px;border-radius:50%;background:var(--accent);
  display:inline-block;position:relative;
  transition:background .25s,opacity .25s,transform .25s;
  transition-delay:var(--d,0ms);
}
.tf-dot.loose{background:var(--good)}
.tf-dot.taken{background:#cfd8e3;opacity:.95;transform:scale(.86)}
.tf-dot::after{
  content:'';position:absolute;inset:2px;opacity:0;
  border-top:2.5px solid var(--bad);transform:rotate(45deg);transform-origin:center;
  transition:opacity .25s;transition-delay:var(--d,0ms);
}
.tf-dot.taken::after{opacity:1}
.tf-dot.keep{box-shadow:0 0 0 3px rgba(27,42,74,.22)}
/* まだ とっていないとき: ばらが足りないことに目を向ける */
.sub-stage[data-phase="split"] #tf-loose{animation:tf-pulse 1.4s ease-in-out infinite}
@keyframes tf-pulse{0%,100%{background:transparent}50%{background:rgba(46,184,114,.18)}}
/* あわせるとき: のこりとばらを一緒に光らせる */
.sub-stage[data-phase="joined"] #tf-ten,
.sub-stage[data-phase="joined"] #tf-loose{background:rgba(46,184,114,.16)}
/* 10までのひきざん: ●をそのまま並べて かぞえる */
.basic-stage{grid-template-columns:auto}
.basic-stage #tf-ten{grid-column:1}
.dot-row{
  display:grid;grid-template-columns:repeat(5,22px);gap:5px;
  padding:6px;justify-content:center;
}
.dot-row .tf-dot{width:22px;height:22px}
.basic-stage[data-phase="after"] #tf-ten{background:rgba(46,184,114,.16)}
/* くり下がりなし: 10のかたまりは手つかず、ばらだけ減る */
.sub-stage[data-phase="tens"] #tf-ten{animation:tf-pulse 1.4s ease-in-out infinite}
.sub-stage[data-phase="ones"] #tf-loose{animation:tf-pulse 1.4s ease-in-out infinite}
.sub-stage[data-phase="done"] #tf-ten,
.sub-stage[data-phase="done"] #tf-loose{background:rgba(46,184,114,.16)}
.kuku-slot.ans-digit{width:1.1em;margin-right:2px}
.sakura{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:#fffaf2;border:2px dashed var(--carry);border-radius:14px;padding:10px 14px;width:100%;
}
.sakura.hidden{display:none}
.sakura-block{display:flex;flex-direction:column;align-items:center;gap:2px}
.sakura-note{font-size:12px;font-weight:700;color:#a1856a}
.sakura-line{display:flex;align-items:center;gap:7px;font-size:24px;font-weight:700}
.sakura-carry{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:1.5em;height:1.2em;border-radius:10px;
  background:#f1f4f8;color:#b9c3d0;font-size:24px;
}
.sakura-carry.filled{background:#e9fbf1;color:var(--good)}

/* ---- ドラッグの数字タイル ---- */
.digit-tile{
  width:52px;height:52px;border-radius:14px;border:none;
  background:#fff;box-shadow:0 3px 0 #d5dde8,0 4px 10px rgba(27,42,74,.10);
  font-size:23px;font-weight:700;color:var(--ink);cursor:grab;
  touch-action:none;font-family:inherit;
}
.digit-tile:active{cursor:grabbing}
#digit-palette{display:grid;grid-template-columns:repeat(5,52px);gap:10px;justify-content:center;padding:4px 0}
#digit-palette:empty{display:none}
#digit-palette .palette-hint{grid-column:1/-1}
.palette-hint{font-size:13px;font-weight:700;color:var(--accent-deep);text-align:center}
.digit-drag-ghost{
  position:fixed;z-index:80;pointer-events:none;
  width:54px;height:54px;border-radius:14px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;
  transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(27,42,74,.3);
}

/* ---- ひっ算ボード ---- */
.calc-outer{display:flex;justify-content:center;align-items:flex-start}
.calc-board{
  display:grid;justify-content:center;gap:2px 0;
  padding:10px 6px;position:relative;
}
.mult-board{margin-left:26px}
.calc-cell{
  display:flex;align-items:center;justify-content:center;
  height:40px;font-size:21px;font-weight:700;color:var(--ink);
  border-radius:8px;
}
.calc-cell.given{color:#5a6678}
.calc-cell.blank{}
.calc-cell.input-slot,.calc-cell.carry-slot,.calc-cell.bringdown-slot{
  background:#f2f5f9;border:2px dashed var(--guide);
}
.calc-cell.carry-slot{height:22px;font-size:14px;color:var(--carry);align-self:end;margin-bottom:2px}
.calc-cell.bringdown-slot{color:#9aa5b5}
.calc-cell.active{border-color:var(--accent);background:#eaf5ff}
.calc-cell.active.carry-slot{border-color:var(--carry);background:#fff3e0}
.calc-cell.drop-hover{background:#d8ecff}
.calc-cell.filled{border-style:solid;border-color:var(--good);background:#e9fbf1}
.calc-cell.correct-flash{animation:pop-flash .32s}
@keyframes pop-flash{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.calc-cell.shake{animation:shake .35s}
.shake{animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
}
.calc-cell.drag-source{background:#fff3e0;border:2px dashed var(--carry);cursor:grab;touch-action:none}
.calc-op-label{
  position:absolute;left:-22px;font-size:21px;font-weight:700;color:#5a6678;
  transform:translateY(8px);
}
.calc-rule{border-top:3px solid var(--ink);height:0;align-self:start;margin-top:-2px}
/* 除数は被除数と同じ行。右の縦線が筆算の「)」になる */
.div-divisor{
  display:flex;align-items:center;justify-content:flex-end;
  height:40px;padding-right:7px;
  font-size:21px;font-weight:700;color:var(--ink);
  border-right:3px solid var(--ink);
}

/* ---- らくがきメモ ---- */
#scratch-panel{display:flex;flex-direction:column;gap:8px}
#scratch-canvas{
  width:100%;height:180px;border-radius:14px;background:#fbfcfe;
  border:2px dashed var(--guide);touch-action:none;display:block;
}
#scratch-actions{display:flex;justify-content:flex-end}

/* ---- けっか ---- */
#result-screen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.result-face{font-size:72px;line-height:1;animation:hop .8s ease 2}
#result-title{font-size:24px;text-align:center}
#result-sub{font-size:14px;font-weight:700;color:var(--muted);text-align:center}
.result-stars{font-size:30px;letter-spacing:4px}
#result-summary{display:flex;gap:8px;justify-content:center;width:100%;max-width:380px}
#result-summary .stat{
  flex:1 1 0;min-width:0;
  background:#fff;border-radius:14px;padding:10px 4px;text-align:center;
  box-shadow:0 2px 8px rgba(27,42,74,.08);
}
#result-summary .stat b{display:block;font-size:21px;color:var(--accent-deep);white-space:nowrap}
#result-summary .stat span{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
#result-mastered{
  background:#fff8e1;border:2px solid var(--gold);border-radius:14px;
  padding:10px 14px;font-size:14px;font-weight:700;text-align:center;line-height:1.6;max-width:340px;
}
#result-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
#result-list .chip{
  background:#fff;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700;
  box-shadow:0 2px 6px rgba(27,42,74,.08);
}
#result-list .chip.miss{background:#fff1ec;color:#c2410c}
.result-actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}

#celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#celebrate span{position:absolute;font-size:26px;animation:pop 1.1s ease-out forwards}
@keyframes pop{
  0%{transform:translateY(0) scale(.4);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-130px) scale(1.25) rotate(25deg);opacity:0}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>

<main>

  <section id="drill-screen" class="hidden"></section>

  <section id="session-screen" class="hidden">

      <div class="sess-line">
        <h2 id="session-title"></h2>
        <div class="sess-right">
          <span id="combo" class="hidden"></span>
          <span id="session-progress"></span>
        </div>
      </div>
      <div class="sess-bar"><div id="sess-fill"></div></div>
    </div>

    <div class="card" id="work-card">
      <div id="work-area"></div>
    </div>

    <div id="digit-palette"></div>

      <span class="buddy-face" id="buddy-face">😺</span>
      <p class="buddy-say" id="buddy-say"></p>
    </div>

    <div id="controls">
      <button class="act ghost" id="btn-scratch">✏️ らくがき</button>
      <button class="act ghost hidden" id="btn-hint">💡 ヒント</button>
      <button class="act success hidden" id="btn-next">つぎへ →</button>
    </div>

    <div class="card hidden" id="scratch-panel">
      <canvas id="scratch-canvas"></canvas>
      <div id="scratch-actions">
        <button class="ghost-btn" id="btn-scratch-clear">🧽 けす</button>

  <section id="result-screen" class="hidden">

    <div class="result-stars" id="result-stars"></div>
    <div id="result-summary"></div>
    <div id="result-mastered" class="hidden"></div>
    <div id="result-list"></div>
    <div class="result-actions">
      <button class="big-btn" id="btn-result-next"></button>
      <button class="act ghost" id="btn-result-again">もういちど おなじ れんしゅう</button>
    </div>
  </section>
</main>

<div id="celebrate"></div>
