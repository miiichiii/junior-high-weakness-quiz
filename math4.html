<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>夏休み 算数マスター（4年生）</title>
<style>
:root{
  --ink:#1b2a4a;
  --paper:#ffffff;
  --bg:#fdf6ec;
  --accent:#3aa8ff;
  --accent-deep:#1f7fd1;
  --good:#2eb872;
  --bad:#e8505b;
  --carry:#ff9f43;
  --guide:#dfe6ee;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overscroll-behavior:none;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 12px 24px;
}
.hidden{display:none !important}
header.topbar{
  width:100%;max-width:480px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:4px 2px 10px;
}
header.topbar h1{font-size:16.5px;letter-spacing:.04em;flex:1;text-align:center}
#back-link{
  font-size:13px;font-weight:700;color:#7a8698;text-decoration:none;
  background:#fff;border-radius:999px;padding:8px 12px;
  box-shadow:0 2px 6px rgba(27,42,74,.12);white-space:nowrap;
}
#sound-btn{
  border:none;background:#fff;border-radius:50%;
  width:38px;height:38px;font-size:18px;
  box-shadow:0 2px 6px rgba(27,42,74,.12);cursor:pointer;flex-shrink:0;
}
main{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}

/* ---- モード選択 ---- */
#mode-grid{display:flex;flex-direction:column;gap:10px}
.mode-card{
  background:var(--paper);border:none;border-radius:var(--radius);
  box-shadow:0 3px 10px rgba(27,42,74,.08);
  padding:14px 16px;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  font-family:inherit;
}
.mode-card-emoji{font-size:28px;flex-shrink:0}
.mode-card-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode-card h3{font-size:16.5px}
.mode-card-stat{font-size:12.5px;color:#7a8698;font-weight:700}
.mode-card.locked{opacity:.55}
.mode-card:active{transform:translateY(1px)}

/* ---- 九九トップ（段えらび） ---- */
#kuku-home{display:flex;flex-direction:column;gap:10px}
.kuku-order-note{font-size:12.5px;font-weight:700;color:#7a8698;text-align:center;padding:2px 0}
.dan-row{
  position:relative;
  display:flex;align-items:center;gap:10px;
  background:var(--paper);border:none;border-radius:14px;
  padding:12px 14px;cursor:pointer;font-family:inherit;
  box-shadow:0 2px 8px rgba(27,42,74,.08);
}
.dan-row:active{transform:translateY(1px)}
.dan-row.recommended{outline:3px solid var(--accent);background:#f4faff}
.dan-reco{
  position:absolute;top:-9px;right:12px;
  font-size:11px;font-weight:700;color:#fff;
  background:var(--accent);border-radius:999px;padding:2px 10px;
}
.dan-name{font-size:15px;font-weight:700;color:var(--ink);width:64px;text-align:left;flex-shrink:0}
.dan-cells{display:flex;gap:3px;flex:1}
.dan-cell{width:13px;height:13px;border-radius:4px;background:#e8edf3;display:inline-block}
.dan-cell.learn{background:#bcd5ff}
.dan-cell.clear{background:#8fd6ae}
.dan-cell.master{background:#ffc94d}
.dan-count{font-size:12.5px;font-weight:700;color:#7a8698;min-width:32px;text-align:right}
.dan-legend{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:11.5px;font-weight:700;color:#7a8698;
}

/* ---- セッション共通 ---- */
#session-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 4px;
}
#session-head h2{font-size:16px}
#session-progress{font-size:13px;font-weight:700;color:#7a8698}
.card{
  background:var(--paper);border-radius:var(--radius);
  box-shadow:0 3px 10px rgba(27,42,74,.08);
  padding:14px;position:relative;
}
#feedback{
  min-height:30px;text-align:center;font-size:14.5px;font-weight:700;
}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
#controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button.act{
  font-family:inherit;font-size:15px;font-weight:700;
  padding:11px 18px;border-radius:999px;border:none;cursor:pointer;
  box-shadow:0 3px 0 rgba(27,42,74,.15);
}
button.act:active{transform:translateY(2px);box-shadow:none}
button.primary{background:var(--accent);color:#fff}
button.success{background:var(--good);color:#fff}
button.ghost{background:#fff;color:#5a6678;border:2px solid var(--guide)}
.ghost-btn{
  font-family:inherit;font-size:13px;font-weight:700;color:var(--accent-deep);
  background:#eaf5ff;border:none;border-radius:999px;padding:7px 14px;cursor:pointer;
}

/* ---- 九九カード ---- */
.kuku-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.kuku-kind{font-size:12px;font-weight:700;color:#7a8698}
.kuku-equation{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700}
.kuku-op{color:#9aa5b5;font-size:26px}
.kuku-slot{
  width:1.6em;height:1.15em;display:inline-flex;align-items:center;justify-content:center;
  border:3px dashed var(--accent);border-radius:12px;color:var(--accent-deep);
  background:#eaf5ff;font-size:.85em;
}
.kuku-slot.correct{border-style:solid;border-color:var(--good);background:#e9fbf1;color:var(--good)}
.kuku-slot.drop-hover{background:#d8ecff}
.kuku-array{display:flex;flex-direction:column;gap:4px;padding:8px;background:#f7f9fc;border-radius:12px}
.kuku-array.hidden{display:none}
.kuku-array-row{display:flex;gap:4px}
.kuku-dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.kuku-choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---- ドラッグの数字タイル ---- */
.digit-tile{
  width:44px;height:44px;border-radius:12px;border:none;
  background:#fff;box-shadow:0 2px 6px rgba(27,42,74,.15);
  font-size:19px;font-weight:700;color:var(--ink);cursor:grab;
  touch-action:none;font-family:inherit;
}
.digit-tile:active{cursor:grabbing}
#digit-palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 0}
.palette-hint{font-size:13px;font-weight:700;color:var(--accent-deep);text-align:center}
.digit-drag-ghost{
  position:fixed;z-index:80;pointer-events:none;
  width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(27,42,74,.3);
}

/* ---- ひっ算ボード ---- */
.calc-outer{display:flex;justify-content:center;align-items:flex-start}
.calc-outer.div-outer{gap:0}
.calc-board{
  display:grid;justify-content:center;gap:2px 0;
  padding:10px 6px;position:relative;
}
.mult-board{margin-left:26px}
.calc-cell{
  display:flex;align-items:center;justify-content:center;
  height:40px;font-size:21px;font-weight:700;color:var(--ink);
  border-radius:8px;
}
.calc-cell.given{color:#5a6678}
.calc-cell.blank{}
.calc-cell.input-slot,.calc-cell.carry-slot,.calc-cell.bringdown-slot{
  background:#f2f5f9;border:2px dashed var(--guide);
}
.calc-cell.carry-slot{height:22px;font-size:14px;color:var(--carry);align-self:end;margin-bottom:2px}
.calc-cell.bringdown-slot{color:#9aa5b5}
.calc-cell.active{border-color:var(--accent);background:#eaf5ff}
.calc-cell.active.carry-slot{border-color:var(--carry);background:#fff3e0}
.calc-cell.drop-hover{background:#d8ecff}
.calc-cell.filled{border-style:solid;border-color:var(--good);background:#e9fbf1}
.calc-cell.correct-flash{animation:pop-flash .32s}
@keyframes pop-flash{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.calc-cell.shake{animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
}
.calc-cell.drag-source{background:#fff3e0;border:2px dashed var(--carry);cursor:grab;touch-action:none}
.calc-op-label{
  position:absolute;left:-22px;font-size:21px;font-weight:700;color:#5a6678;
  transform:translateY(8px);
}
.calc-rule{border-top:3px solid var(--ink);height:0;align-self:start;margin-top:-2px}
.div-bracket{
  display:flex;align-items:flex-start;justify-content:flex-end;
  width:34px;height:84px;flex-shrink:0;
  padding-right:6px;padding-top:12px;font-size:19px;font-weight:700;color:var(--ink);
  border-right:3px solid var(--ink);border-top:3px solid var(--ink);
  margin-top:10px;box-sizing:border-box;
}

/* ---- らくがきメモ ---- */
#scratch-panel{display:flex;flex-direction:column;gap:8px}
#scratch-canvas{
  width:100%;height:180px;border-radius:14px;background:#fbfcfe;
  border:2px dashed var(--guide);touch-action:none;display:block;
}
#scratch-actions{display:flex;justify-content:flex-end}

/* ---- 結果画面 ---- */
#result-screen.show,#result-screen:not(.hidden){display:flex}
#result-screen{
  flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:20px 0;
}
#result-screen h2{font-size:22px;text-align:center}
#result-summary{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#result-summary .stat{
  background:#fff;border-radius:14px;padding:10px 16px;text-align:center;
  box-shadow:0 2px 8px rgba(27,42,74,.08);min-width:80px;
}
#result-summary .stat b{display:block;font-size:22px;color:var(--accent-deep)}
#result-summary .stat span{font-size:12px;color:#7a8698;font-weight:700}
#result-list{display:flex;flex-direction:column;gap:6px;max-width:320px;width:100%}
#result-list .row{
  background:#fff;border-radius:14px;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 8px rgba(27,42,74,.08);font-size:15px;font-weight:700;
}
#result-list .row .st{font-size:13px;letter-spacing:1px}

#celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#celebrate span{position:absolute;font-size:26px;animation:pop 1.1s ease-out forwards}
@keyframes pop{
  0%{transform:translateY(0) scale(.4);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-130px) scale(1.25) rotate(25deg);opacity:0}
}
</style>
</head>
<body>
<header class="topbar">
  <a id="back-link" href="index.html?child=child-3">← もどる</a>
  <h1>🔢 夏休み 算数マスター</h1>
  <button id="sound-btn" aria-label="おと">🔊</button>
</header>

<main>
  <section id="mode-screen">
    <div id="mode-grid"></div>
  </section>

  <section id="kuku-screen" class="hidden">
    <div id="kuku-home"></div>
  </section>

  <section id="session-screen" class="hidden">
    <div id="session-head">
      <h2 id="session-title"></h2>
      <span id="session-progress"></span>
    </div>

    <div class="card" id="work-card">
      <div id="work-area"></div>
    </div>

    <div id="digit-palette"></div>
    <div id="feedback" class="feedback"></div>

    <div id="controls">
      <button class="act ghost" id="btn-scratch">✏️ らくがき</button>
      <button class="act ghost hidden" id="btn-hint">💡 ヒント</button>
      <button class="act success hidden" id="btn-next">つぎへ →</button>
      <button class="act ghost hidden" id="btn-back-modes">モードえらび</button>
    </div>

    <div class="card hidden" id="scratch-panel">
      <canvas id="scratch-canvas"></canvas>
      <div id="scratch-actions">
        <button class="ghost-btn" id="btn-scratch-clear">🧽 けす</button>
      </div>
    </div>
  </section>

  <section id="result-screen" class="hidden">
    <h2 id="result-title"></h2>
    <div id="result-summary"></div>
    <div id="result-list"></div>
    <div id="controls">
      <button class="act primary" id="btn-result-again">もういちど</button>
      <button class="act ghost" id="btn-result-modes">モードえらび</button>
      <a id="result-home" href="index.html?child=child-3"><button class="act ghost">ホームへ もどる</button></a>
    </div>
  </section>
</main>

<div id="celebrate"></div>

<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260805-shared-cloud-v1"></script>
<script src="firebase-sync.js?v=20260820-google-login-recovery-v1"></script>
<script src="math4-app.js?v=20260803-math4-dan-v1"></script>
</body>
</html>
