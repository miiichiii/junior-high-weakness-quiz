<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>夏休み 漢字マスター（4年生）</title>
<style>
:root{
  --ink:#1b2a4a;
  --paper:#ffffff;
  --bg:#fdf6ec;
  --accent:#ff9f43;
  --accent-deep:#f2811d;
  --good:#2eb872;
  --bad:#e8505b;
  --review:#5f96f5;
  --guide:#dfe6ee;
  --radius:18px;
}
*{
  box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none; /* 長押しで「コピー」等のメニューを出さない */
  -webkit-user-select:none;user-select:none; /* テキスト選択にしない */
}
html,body{height:100%}
html{touch-action:manipulation} /* ダブルタップでの拡大ジェスチャーを無効化 */
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overscroll-behavior:none;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 12px 24px;
  touch-action:manipulation;
}
header.topbar{
  width:100%;max-width:440px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:4px 2px 6px;
}
header.topbar h1{font-size:16.5px;letter-spacing:.04em;flex:1;text-align:center}
#back-link{
  font-size:13px;font-weight:700;color:#7a8698;text-decoration:none;
  background:#fff;border-radius:999px;padding:8px 12px;
  box-shadow:0 2px 6px rgba(27,42,74,.12);white-space:nowrap;
}
#sound-btn{
  border:none;background:#fff;border-radius:50%;
  width:38px;height:38px;font-size:18px;
  box-shadow:0 2px 6px rgba(27,42,74,.12);cursor:pointer;flex-shrink:0;
}
#pace-line{
  width:100%;max-width:440px;
  text-align:center;font-size:12.5px;font-weight:700;color:#7a8698;
  padding:2px 0 4px;
}
/* 同期の状態表示。子どもの邪魔にならないよう小さく、
   おうちの人が「ちゃんと同期されているか」を確認できるようにする */
#sync-row{
  width:100%;max-width:440px;
  display:flex;justify-content:center;
  padding-bottom:8px;
}
#sync-chip{
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:3px 10px;border-radius:999px;
  text-decoration:none;
  border:1px solid #e2e8f0;background:#fff;color:#98a3b3;
}
#sync-chip[data-state="synced"]{border-color:#bfe8d3;background:#f2fbf6;color:#2c9c68}
#sync-chip[data-state="saving"]{border-color:#ffe0b8;background:#fff8ef;color:#d98324}
#sync-chip[data-state="local"]{border-color:#ffd0d4;background:#fff5f6;color:#d9576a}
#sync-chip[data-state="error"]{border-color:#ffd0d4;background:#fff5f6;color:#d9576a}
/* ログイン済み・設定なしのときはタップしても行き先が無いので押せなくする */
#sync-chip[data-state="synced"],
#sync-chip[data-state="saving"],
#sync-chip[data-state="checking"],
#sync-chip[data-state="off"]{pointer-events:none}
#progress{
  width:100%;max-width:440px;
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin-bottom:10px;
}
#progress .dot{
  width:30px;height:30px;border-radius:50%;
  background:#fff;border:2px solid var(--guide);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#b9c3d0;
  transition:all .25s;
}
#progress .dot.review{border-style:dashed;border-color:#bcd5ff}
#progress .dot.now{border-color:var(--accent);color:var(--accent-deep);transform:scale(1.12)}
#progress .dot.done{background:var(--good);border-color:var(--good);color:#fff}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--paper);border-radius:var(--radius);
  box-shadow:0 3px 10px rgba(27,42,74,.08);
  padding:12px 14px;position:relative;
}
#item-badge{
  position:absolute;top:-9px;left:14px;
  font-size:11.5px;font-weight:700;color:#fff;
  padding:3px 10px;border-radius:999px;background:var(--accent);
}
#item-badge.review{background:var(--review)}
#prompt-label{font-size:12.5px;color:#7a8698;margin:4px 0 6px}
#prompt-word{
  font-size:34px;font-weight:700;text-align:center;line-height:1.2;
}
#prompt-word ruby rt{font-size:13px;color:var(--accent-deep);font-weight:600}
#prompt-word .blank{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.25em;height:1.25em;vertical-align:-0.18em;
  border:2.5px dashed var(--accent);border-radius:8px;
  color:var(--accent);font-size:.62em;
  background:#fff7ec;
}
#prompt-word .okuri{color:#9aa5b5}
#prompt-sentence{font-size:13.5px;color:#5a6678;text-align:center;margin-top:6px}
#phase-row{
  display:flex;gap:8px;justify-content:center;align-items:center;
}
.chip{
  font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;
  border:2px solid var(--guide);background:#fff;color:#8a95a5;
}
.chip.on{border-color:var(--accent);background:#fff3e0;color:var(--accent-deep)}
#board-wrap{
  position:relative;width:100%;
  display:flex;justify-content:center;
}
#board{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:0 3px 10px rgba(27,42,74,.08);
  touch-action:none;
  display:block;
}
#board.shake{animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
}
#feedback{
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:15.5px;font-weight:700;
}
#feedback.good{color:var(--good)}
#feedback.bad{color:var(--bad)}
#controls{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
}
.act{
  font-family:inherit;font-size:15px;font-weight:700;
  padding:12px 18px;border-radius:999px;border:none;cursor:pointer;
  box-shadow:0 3px 0 rgba(27,42,74,.15);
  transition:transform .1s;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;
}
.act:active{transform:translateY(2px);box-shadow:none}
.primary{background:var(--accent);color:#fff}
.success{background:var(--good);color:#fff}
.ghost{background:#fff;color:#5a6678;border:2px solid var(--guide)}
button.hidden,.hidden{display:none !important}
#stroke-counter{
  text-align:center;font-size:13px;color:#7a8698;font-weight:700;
}
#celebrate{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;
}
#celebrate span{
  position:absolute;font-size:26px;
  animation:pop 1.1s ease-out forwards;
}
@keyframes pop{
  0%{transform:translateY(0) scale(.4);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-130px) scale(1.25) rotate(25deg);opacity:0}
}
#result-screen{
  position:fixed;inset:0;background:rgba(253,246,236,.97);z-index:60;
  display:none;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  overflow-y:auto;
}
#result-screen.show{display:block}
#result-panel{
  width:100%;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
}
#result-screen h2{font-size:24px;text-align:center}
#result-summary{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
#result-summary .stat{
  background:#fff;border-radius:14px;padding:10px 16px;text-align:center;
  box-shadow:0 2px 8px rgba(27,42,74,.08);min-width:88px;
}
#result-summary .stat b{display:block;font-size:22px;color:var(--accent-deep)}
#result-summary .stat span{font-size:12px;color:#7a8698;font-weight:700}
#result-list{display:flex;flex-direction:column;gap:8px;max-width:320px;width:100%}
#result-list .row{
  background:#fff;border-radius:14px;padding:8px 18px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 8px rgba(27,42,74,.08);
  font-size:20px;font-weight:700;
}
#result-list .row .st{font-size:16px;letter-spacing:2px}
#result-list .row .kind{font-size:11px;color:#8a95a5;margin-left:auto}
#result-actions{
  width:100%;max-width:320px;
  display:flex;flex-direction:column;gap:10px;
}
#result-actions>a,#result-actions .act{width:100%;text-align:center}
footer.credit{
  width:100%;max-width:440px;margin-top:16px;
  font-size:11px;color:#a5aebc;text-align:center;line-height:1.6;
}
footer.credit a{color:#a5aebc}
</style>
</head>
<body>
<header class="topbar">
  <a id="back-link" href="index.html?child=child-3">← もどる</a>
  <h1>✍️ 夏休み 漢字マスター</h1>
  <button id="sound-btn" aria-label="おと">🔊</button>
</header>

<div id="pace-line"></div>
<div id="sync-row"><a id="sync-chip" data-state="checking" href="index.html?child=child-3">…</a></div>
<div id="progress"></div>

<main>
  <section class="card" id="prompt-card">
    <span id="item-badge"></span>
    <div id="prompt-label">□に はいる かんじを ゆびで かこう！</div>
    <div id="prompt-word"></div>
    <div id="prompt-sentence"></div>
  </section>

  <div id="phase-row">
    <span class="chip" id="chip-trace">① なぞって れんしゅう</span>
    <span class="chip" id="chip-memory">② みないで チャレンジ</span>
  </div>

  <div id="board-wrap"><canvas id="board"></canvas></div>

  <div id="stroke-counter"></div>
  <div id="feedback"></div>

  <div id="controls">
    <button class="act ghost" id="btn-demo">▶ おてほん</button>
    <button class="act ghost hidden" id="btn-hint">💡 ヒント</button>
    <button class="act ghost hidden" id="btn-undo">↩ ひとつけす</button>
    <button class="act ghost hidden" id="btn-clear">🧽 ぜんぶけす</button>
    <button class="act primary hidden" id="btn-submit">できた！</button>
    <button class="act ghost hidden" id="btn-relearn">✏️ なぞって おもいだす</button>
    <button class="act primary hidden" id="btn-memory">みないで チャレンジ！</button>
    <button class="act success hidden" id="btn-next">つぎへ →</button>
    <button class="act ghost hidden" id="btn-retry">もういちど</button>
  </div>
</main>

<div id="celebrate"></div>

<div id="result-screen" role="dialog" aria-modal="true" aria-labelledby="result-title">
  <div id="result-panel">
    <h2 id="result-title">🎉 きょうのぶんは おわり！</h2>
    <div id="result-summary"></div>
    <div id="result-list"></div>
    <div id="result-actions">
      <button class="act primary" id="btn-next-new" type="button">🌱 次の4文字に挑戦</button>
      <button class="act ghost" id="btn-okawari" type="button">💪 おかわり れんしゅう</button>
      <a class="act ghost" id="result-home" href="index.html?child=child-3">ホームへ もどる</a>
    </div>
  </div>
</div>

<footer class="credit">

</body>
